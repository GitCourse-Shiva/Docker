<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Chess · Racer's Gambit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #1a1e24 0%, #2b3138 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
      padding: 1rem;
    }

    .game-container {
      background: #1e2228;
      border-radius: 3rem 3rem 2rem 2rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 30px 35px -10px rgba(0, 0, 0, 0.8), inset 0 1px 4px rgba(255, 255, 255, 0.08);
      border: 1px solid #4d5a68;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffcf7a;
      text-shadow: 0 4px 0 #7f4e1a, 0 8px 12px black;
      margin-top: -0.8rem;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .subhead {
      text-align: center;
      color: #aab9cc;
      font-size: 0.9rem;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      font-weight: 400;
      text-transform: uppercase;
      background: #2f3741;
      display: inline-block;
      padding: 0.2rem 1.8rem;
      border-radius: 30px;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
      border: 1px solid #5a6b7c;
      box-shadow: inset 0 1px 3px #0b0e11;
    }

    .board-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1rem 0;
    }

    .chessboard {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(70vw, 70vh, 560px);
      height: min(70vw, 70vh, 560px);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 30px -5px black, 0 0 0 3px #2e3843, 0 0 0 8px #11161b;
      background: #1a1f24;
      transition: box-shadow 0.2s;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(6vw, 6vh, 3.2rem);
      font-weight: 600;
      position: relative;
      transition: background 0.1s, transform 0.1s;
      cursor: default;
      user-select: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .light {
      background: #d9d9d9;
      background-image: radial-gradient(circle at 20% 20%, #f0f0f0, #b0b0b0);
      color: #2a2a2a;
    }

    .dark {
      background: #4b5b6b;
      background-image: radial-gradient(circle at 80% 80%, #5f7285, #2c3a47);
      color: #f0f0f0;
    }

    /* Car / chess pieces styling */
    .piece {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.7));
      transition: transform 0.15s ease;
      transform: scale(1);
    }

    /* car emoji look */
    .piece span {
      display: block;
      font-size: 1.4em;
      line-height: 1;
      transform: scale(1.2);
    }

    /* racing themed pieces (car emojis, but chess logic) */
    .white-piece span {
      color: #f5f5f5;
      text-shadow: 0 0 6px #9ac7ff, 0 0 12px #ffffff;
    }

    .black-piece span {
      color: #1a1a1a;
      text-shadow: 0 0 8px #ffb86b, 0 0 14px #ff8c00;
    }

    /* highlight last move / selected */
    .selected {
      box-shadow: inset 0 0 0 5px #f5d742, inset 0 0 20px #ffb800;
      z-index: 5;
    }

    .last-move {
      box-shadow: inset 0 0 0 4px rgba(255, 215, 0, 0.5), inset 0 0 15px #ffbb00;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #13181e;
      padding: 0.7rem 1.8rem;
      border-radius: 100px;
      margin-top: 1.2rem;
      border: 1px solid #3e4a56;
      box-shadow: inset 0 3px 8px #090c0f, 0 5px 10px black;
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #eaeef2;
      font-weight: 500;
      letter-spacing: 1px;
      font-size: 1.1rem;
    }

    .turn-badge {
      background: #2d3844;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      border: 1px solid #6e7e8f;
      color: #ffd966;
    }

    .check-indicator {
      color: #ff7b7b;
      font-weight: 700;
      text-shadow: 0 0 6px red;
      background: #2d1e1e;
      padding: 0.2rem 1.2rem;
      border-radius: 30px;
      border: 1px solid #a14545;
    }

    .btn {
      background: #2f3c4a;
      border: none;
      border-radius: 2rem;
      padding: 0.5rem 1.4rem;
      font-weight: 600;
      color: #e9eef3;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 5px 0 #0b0f13, 0 6px 12px black;
      font-size: 0.9rem;
      text-transform: uppercase;
      border: 1px solid #5b6e82;
    }

    .btn:hover {
      background: #3f5061;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #0b0f13, 0 10px 18px black;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0b0f13, 0 6px 12px black;
    }

    /* small car deco */
    .car-deco {
      font-size: 1.1rem;
      opacity: 0.7;
      margin-right: 0.4rem;
    }

    /* responsive */
    @media (max-width: 520px) {
      .game-container {
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      .status-bar {
        flex-direction: column;
        gap: 0.7rem;
        align-items: stretch;
        text-align: center;
      }
      .turn-indicator {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>🏁 CAR CHESS 🏁</h1>
  <div style="display: flex; justify-content: center;">
    <div class="subhead">RACER'S GAMBIT</div>
  </div>

  <div class="board-wrapper">
    <div class="chessboard" id="chessboard"></div>
  </div>

  <div class="status-bar">
    <div class="turn-indicator">
      <span class="car-deco">🏎️</span>
      <span id="turnText">White's turn</span>
      <span class="turn-badge" id="turnBadge">⚪</span>
    </div>
    <div id="checkMessage" style="color: #ffb86b; font-weight: 600;"></div>
    <button class="btn" id="resetBtn">↺ New Race</button>
  </div>
</div>

<script>
  (function() {
    // ---------- CAR CHESS GAME LOGIC (standard chess, car-themed pieces) ----------
    // Board representation: 8x8, each cell null or { type, color }
    // type: 'p','r','n','b','q','k' ; color: 'w','b'
    // Mapping to car emojis: we just use car / racing emojis for each piece type.
    // white pieces: 🏎️ (pawn), 🚓 (rook), 🚕 (knight), 🚌 (bishop), 🚑 (queen), 🚒 (king)
    // black pieces: 🏎️ (pawn) with dark styling, etc. We'll use same emoji but styled differently.
    // Actually better: white → white car icons, black → dark car icons. Use different emojis to differentiate.
    // Let's define clear ones: 
    // White: pawn '🚗', rook '🚙', knight '🚕', bishop '🚌', queen '🚑', king '🚒' (fire truck as king, fun)
    // Black: pawn '🚓', rook '🚔', knight '🚖', bishop '🚍', queen '🚘', king '🚖' but we need unique. 
    // Better: use same set but with styling: white pieces white text-shadow, black pieces dark with golden shadow.
    // But emoji already have color. To differentiate clearly, I'll use different vehicle emojis for black.
    // White: 🚗 (pawn), 🚙 (rook), 🚕 (knight), 🚌 (bishop), 🚑 (queen), 🚒 (king) 
    // Black: 🚓 (pawn), 🚔 (rook), 🚖 (knight), 🚍 (bishop), 🚘 (queen), 🚖 (king) -> but knight and king same. 
    // Let's rethink: black: pawn '🚓', rook '🚔', knight '🚖', bishop '🚍', queen '🚘', king '🚖' → conflict. 
    // Use '🚜' for king? or '🚚' for king. Ok final:
    // White: pawn '🚗', rook '🚙', knight '🚕', bishop '🚌', queen '🚑', king '🚒'
    // Black: pawn '🚓', rook '🚔', knight '🚖', bishop '🚍', queen '🚘', king '🚚' (truck as king) 
    // All are cars/vehicles, fits "car chess" theme.
    
    const pieceEmoji = {
      w: { p: '🚗', r: '🚙', n: '🚕', b: '🚌', q: '🚑', k: '🚒' },
      b: { p: '🚓', r: '🚔', n: '🚖', b: '🚍', q: '🚘', k: '🚚' }
    };

    // Initial board setup
    function getInitialBoard() {
      const board = Array(8).fill().map(() => Array(8).fill(null));
      
      // Black pieces (top, row 0 and 1)
      const backRankBlack = ['r','n','b','q','k','b','n','r'];
      for (let col = 0; col < 8; col++) {
        board[0][col] = { type: backRankBlack[col], color: 'b' };
        board[1][col] = { type: 'p', color: 'b' };
      }
      
      // White pieces (bottom, row 6 and 7)
      const backRankWhite = ['r','n','b','q','k','b','n','r'];
      for (let col = 0; col < 8; col++) {
        board[6][col] = { type: 'p', color: 'w' };
        board[7][col] = { type: backRankWhite[col], color: 'w' };
      }
      
      return board;
    }

    // Game state
    let board = getInitialBoard();
    let turn = 'w'; // 'w' or 'b'
    let selectedRow = -1, selectedCol = -1;
    let lastMove = null; // { fromRow, fromCol, toRow, toCol }
    let gameOver = false;
    let checkFlag = false;

    // DOM elements
    const boardEl = document.getElementById('chessboard');
    const turnTextEl = document.getElementById('turnText');
    const turnBadgeEl = document.getElementById('turnBadge');
    const checkMessageEl = document.getElementById('checkMessage');
    const resetBtn = document.getElementById('resetBtn');

    // Helper: deep copy board
    function cloneBoard(b) {
      return b.map(row => row.map(cell => cell ? { ...cell } : null));
    }

    // --- Chess move validation (standard) ---
    function isPathClear(board, fromRow, fromCol, toRow, toCol) {
      const dr = Math.sign(toRow - fromRow);
      const dc = Math.sign(toCol - fromCol);
      let r = fromRow + dr;
      let c = fromCol + dc;
      while (r !== toRow || c !== toCol) {
        if (board[r][c] !== null) return false;
        r += dr;
        c += dc;
      }
      return true;
    }

    function isValidMove(board, fromRow, fromCol, toRow, toCol, color) {
      if (fromRow === toRow && fromCol === toCol) return false;
      const piece = board[fromRow][fromCol];
      if (!piece || piece.color !== color) return false;
      const target = board[toRow][toCol];
      if (target && target.color === color) return false;

      const type = piece.type;
      const dr = toRow - fromRow;
      const dc = toCol - fromCol;
      const absDr = Math.abs(dr);
      const absDc = Math.abs(dc);

      // Pawn
      if (type === 'p') {
        const direction = color === 'w' ? -1 : 1; // white moves up (decreasing row)
        const startRow = color === 'w' ? 6 : 1;
        
        // forward one
        if (dc === 0 && dr === direction && !target) {
          return true;
        }
        // forward two from start
        if (dc === 0 && dr === 2 * direction && fromRow === startRow && !target) {
          const intermediateRow = fromRow + direction;
          if (!board[intermediateRow][fromCol]) return true;
        }
        // capture diagonally
        if (absDc === 1 && dr === direction && target && target.color !== color) {
          return true;
        }
        // TODO: en passant (skip for simplicity)
        return false;
      }

      // Knight
      if (type === 'n') {
        return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
      }

      // Bishop
      if (type === 'b') {
        return absDr === absDc && isPathClear(board, fromRow, fromCol, toRow, toCol);
      }

      // Rook
      if (type === 'r') {
        return (dr === 0 || dc === 0) && isPathClear(board, fromRow, fromCol, toRow, toCol);
      }

      // Queen
      if (type === 'q') {
        return (absDr === absDc || dr === 0 || dc === 0) && isPathClear(board, fromRow, fromCol, toRow, toCol);
      }

      // King (no castling for simplicity)
      if (type === 'k') {
        return absDr <= 1 && absDc <= 1;
      }

      return false;
    }

    // Check if a king of given color is in check
    function isKingInCheck(board, color) {
      let kingRow = -1, kingCol = -1;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p.type === 'k' && p.color === color) {
            kingRow = r; kingCol = c;
            break;
          }
        }
        if (kingRow !== -1) break;
      }
      if (kingRow === -1) return false; // no king? shouldn't happen
      
      const opponent = color === 'w' ? 'b' : 'w';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p.color === opponent) {
            if (isValidMove(board, r, c, kingRow, kingCol, opponent)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Check if the player has any legal moves (to detect checkmate/stalemate)
    function hasAnyLegalMove(board, color) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p || p.color !== color) continue;
          for (let tr = 0; tr < 8; tr++) {
            for (let tc = 0; tc < 8; tc++) {
              if (isValidMove(board, r, c, tr, tc, color)) {
                // simulate move
                const simBoard = cloneBoard(board);
                simBoard[tr][tc] = simBoard[r][c];
                simBoard[r][c] = null;
                if (!isKingInCheck(simBoard, color)) {
                  return true;
                }
              }
            }
          }
        }
      }
      return false;
    }

    // --- Rendering ---
    function renderBoard() {
      boardEl.innerHTML = '';
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.classList.add('square');
          square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
          
          // data attributes for event handling
          square.dataset.row = r;
          square.dataset.col = c;
          
          // highlight selected
          if (selectedRow === r && selectedCol === c) {
            square.classList.add('selected');
          }
          
          // highlight last move
          if (lastMove) {
            if ((lastMove.fromRow === r && lastMove.fromCol === c) || 
                (lastMove.toRow === r && lastMove.toCol === c)) {
              square.classList.add('last-move');
            }
          }
          
          const piece = board[r][c];
          if (piece) {
            const pieceDiv = document.createElement('div');
            pieceDiv.classList.add('piece');
            pieceDiv.classList.add(piece.color === 'w' ? 'white-piece' : 'black-piece');
            const span = document.createElement('span');
            span.textContent = pieceEmoji[piece.color][piece.type];
            pieceDiv.appendChild(span);
            square.appendChild(pieceDiv);
          }
          
          boardEl.appendChild(square);
        }
      }

      // update status texts
      if (gameOver) {
        turnTextEl.textContent = 'Game over';
      } else {
        turnTextEl.textContent = turn === 'w' ? "White's turn" : "Black's turn";
        turnBadgeEl.textContent = turn === 'w' ? '⚪' : '⚫';
      }

      // check indicator
      if (!gameOver && isKingInCheck(board, turn)) {
        checkMessageEl.textContent = '⚠️ CHECK! ⚠️';
        checkMessageEl.style.color = '#ff7b7b';
      } else {
        checkMessageEl.textContent = '';
      }

      // if game over due to checkmate/stalemate
      if (!gameOver) {
        const inCheck = isKingInCheck(board, turn);
        const hasMoves = hasAnyLegalMove(board, turn);
        if (!hasMoves) {
          gameOver = true;
          if (inCheck) {
            const winner = turn === 'w' ? 'Black' : 'White';
            turnTextEl.textContent = `Checkmate! ${winner} wins! 🏆`;
            checkMessageEl.textContent = '🏁 FINISH 🏁';
          } else {
            turnTextEl.textContent = 'Stalemate! Draw.';
            checkMessageEl.textContent = '🤝 DRAW 🤝';
          }
          turnBadgeEl.textContent = '🏁';
        }
      }
    }

    // --- Game logic: attempt move ---
    function tryMove(fromRow, fromCol, toRow, toCol) {
      if (gameOver) return false;
      
      const piece = board[fromRow][fromCol];
      if (!piece || piece.color !== turn) return false;
      
      if (!isValidMove(board, fromRow, fromCol, toRow, toCol, turn)) return false;
      
      // simulate to check if own king is safe
      const simBoard = cloneBoard(board);
      simBoard[toRow][toCol] = simBoard[fromRow][fromCol];
      simBoard[fromRow][fromCol] = null;
      
      if (isKingInCheck(simBoard, turn)) {
        // illegal move: own king would be in check
        return false;
      }
      
      // apply move
      board[toRow][toCol] = board[fromRow][fromCol];
      board[fromRow][fromCol] = null;
      
      // update last move
      lastMove = { fromRow, fromCol, toRow, toCol };
      
      // switch turn
      turn = (turn === 'w' ? 'b' : 'w');
      selectedRow = -1;
      selectedCol = -1;
      
      renderBoard();
      return true;
    }

    // --- Event handling (click on board) ---
    function handleSquareClick(e) {
      const square = e.target.closest('.square');
      if (!square) return;
      if (gameOver) return;

      const row = parseInt(square.dataset.row);
      const col = parseInt(square.dataset.col);
      const piece = board[row][col];

      // if there's a selected piece and we click a valid target
      if (selectedRow !== -1 && selectedCol !== -1) {
        // if clicked on same square -> deselect
        if (selectedRow === row && selectedCol === col) {
          selectedRow = -1;
          selectedCol = -1;
          renderBoard();
          return;
        }

        // try to move
        const success = tryMove(selectedRow, selectedCol, row, col);
        if (success) {
          // move executed, turn switched, board re-rendered inside tryMove
          return;
        } else {
          // if clicked on another piece of same color, reselect
          if (piece && piece.color === turn) {
            selectedRow = row;
            selectedCol = col;
            renderBoard();
          } else {
            // invalid move, deselect
            selectedRow = -1;
            selectedCol = -1;
            renderBoard();
          }
        }
      } else {
        // no selected piece: select if it's the current player's piece
        if (piece && piece.color === turn) {
          selectedRow = row;
          selectedCol = col;
          renderBoard();
        }
      }
    }

    // --- Reset game ---
    function resetGame() {
      board = getInitialBoard();
      turn = 'w';
      selectedRow = -1;
      selectedCol = -1;
      lastMove = null;
      gameOver = false;
      checkMessageEl.textContent = '';
      renderBoard();
    }

    // --- Initialize ---
    boardEl.addEventListener('click', handleSquareClick);
    resetBtn.addEventListener('click', resetGame);

    // start
    renderBoard();

    // Since there's no en passant, promotion, or castling, game is simpler but functional.
    // (Promotion missing – we just keep pawn as pawn, but can note as "car stays same")
    // Actually to avoid weirdness, we should handle promotion: if pawn reaches last rank, promote to queen (vehicle upgrade)
    // Let's patch the move function: after move, check if pawn reached last rank, replace with queen.
    // Quick patch: we'll overwrite the original tryMove with a version that does promotion.
    const originalTryMove = tryMove;
    tryMove = function(fromRow, fromCol, toRow, toCol) {
      if (gameOver) return false;
      
      const piece = board[fromRow][fromCol];
      if (!piece || piece.color !== turn) return false;
      
      if (!isValidMove(board, fromRow, fromCol, toRow, toCol, turn)) return false;
      
      const simBoard = cloneBoard(board);
      simBoard[toRow][toCol] = simBoard[fromRow][fromCol];
      simBoard[fromRow][fromCol] = null;
      
      if (isKingInCheck(simBoard, turn)) {
        return false;
      }
      
      // apply move
      board[toRow][toCol] = board[fromRow][fromCol];
      board[fromRow][fromCol] = null;
      
      // Promotion: if pawn reaches last row
      const movedPiece = board[toRow][toCol];
      if (movedPiece.type === 'p') {
        if ((movedPiece.color === 'w' && toRow === 0) || (movedPiece.color === 'b' && toRow === 7)) {
          // promote to queen (car upgrade)
          movedPiece.type = 'q';
        }
      }
      
      lastMove = { fromRow, fromCol, toRow, toCol };
      turn = (turn === 'w' ? 'b' : 'w');
      selectedRow = -1;
      selectedCol = -1;
      
      renderBoard();
      return true;
    }.bind(this);

    // Re-assign event handlers (since tryMove is used inside handleSquareClick, but it's a closure, we need to update it.)
    // Simpler: just redefine handleSquareClick using the new tryMove. Let's rebind.
    // We'll just replace the event listener with a new function that uses the updated tryMove.
    // But easier: instead of patching, I'll rewrite the whole script cleanly? But this is getting long.
    // Let me just do a final clean solution: I'll rewrite the script section from scratch in my head.
    // Actually better: I'll edit the script now to include promotion directly in the main tryMove, 
    // but since it's inline, I'll just modify the code above to include promotion.
    // But the code above already defined tryMove; I'll modify it in place using a different approach:
    // I'll just re-declare the whole game logic with promotion included.
    // However to keep answer clean, I'll provide final version with promotion built in.
    // So let me rewrite the script portion from line ~130 to end to include promotion.

</script>
