<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small snake game</title>
    <style>
        /* minimal reset & centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a2a1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .game-wrapper {
            background: #0e1a12;
            padding: 20px 20px 25px;
            border-radius: 32px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6), inset 0 0 8px #3a5e3a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            display: block;
            background: #1e2f1e;
            border-radius: 18px;
            box-shadow: inset 0 0 0 2px #3b5e3b, 0 8px 0 #0b130b;
            width: 400px;
            height: 400px;
            image-rendering: crisp-edges; /* keep pixels sharp */
        }

        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 0 8px;
            color: #b8e0b8;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 0 #0a130a;
        }

        .score {
            background: #0c180c;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 1.3rem;
            box-shadow: inset 0 2px 5px #00000055, 0 5px 0 #050a05;
            color: #d4f0d4;
        }

        .restart-btn {
            background: #2f4f2f;
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #e2ffe2;
            cursor: pointer;
            box-shadow: 0 6px 0 #0b130b, 0 6px 10px black;
            transition: all 0.05s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b130b, 0 6px 10px black;
        }

        .restart-btn:hover {
            background: #3e6b3e;
        }

        .hint {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #7d9f7d;
            font-weight: 500;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="status-bar">
            <div class="score">🍎 <span id="scoreDisplay">0</span></div>
            <button class="restart-btn" id="restartButton">↻ again</button>
        </div>
        <div class="hint">← ↑ → ↓   arrow keys</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');

            // ---- game settings ----
            const GRID_SIZE = 20;          // 20x20 cells
            const CELL_SIZE = 20;          // px (400/20)
            const TICK_INTERVAL_MS = 150;  // speed

            // ---- game state ----
            let snake = [];                // array of {x, y} from head to tail
            let food = { x: 6, y: 10 };
            let direction = 'RIGHT';       // current moving direction
            let nextDirection = 'RIGHT';   // buffered next direction
            let score = 0;
            let gameOver = false;
            let winFlag = false;           // to differentiate win message

            let gameInterval = null;
            let gameRunning = false;

            // ---- helper functions ----
            function randomInt(max) {
                return Math.floor(Math.random() * max);
            }

            // generate new food at empty cell
            function generateRandomFood() {
                const totalCells = GRID_SIZE * GRID_SIZE;
                if (snake.length >= totalCells) {
                    // board is full → win condition
                    return null;
                }

                // collect all free cells
                const freeCells = [];
                // using a Set for fast lookup
                const snakeSet = new Set(snake.map(cell => `${cell.x},${cell.y}`));

                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!snakeSet.has(`${x},${y}`)) {
                            freeCells.push({ x, y });
                        }
                    }
                }

                if (freeCells.length === 0) return null;
                const randIndex = Math.floor(Math.random() * freeCells.length);
                return freeCells[randIndex];
            }

            // reset everything
            function resetGame() {
                // stop any running interval
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }

                // initial snake: length 3, placed horizontally
                snake = [
                    { x: 9, y: 10 }, // head
                    { x: 8, y: 10 },
                    { x: 7, y: 10 }
                ];

                direction = 'RIGHT';
                nextDirection = 'RIGHT';
                score = 0;
                gameOver = false;
                winFlag = false;
                scoreSpan.textContent = '0';

                // place food (ensure it's not on snake)
                const newFood = generateRandomFood();
                if (newFood) {
                    food = newFood;
                } else {
                    // extremely rare on fresh board, but fallback
                    food = { x: 15, y: 15 };
                }

                gameRunning = true;
                drawBoard();
                startGameLoop();
            }

            // draw everything
            function drawBoard() {
                ctx.clearRect(0, 0, 400, 400);

                // draw subtle grid
                ctx.strokeStyle = '#2b452b';
                ctx.lineWidth = 0.8;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, 400);
                    ctx.stroke();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(400, i * CELL_SIZE);
                    ctx.stroke();
                }

                // draw snake (head first, gradient effect)
                snake.forEach((segment, idx) => {
                    const isHead = idx === 0;
                    const x = segment.x * CELL_SIZE;
                    const y = segment.y * CELL_SIZE;

                    if (isHead) {
                        // vibrant head
                        ctx.fillStyle = '#8bc34a';
                        ctx.shadowColor = '#c5e1a5';
                        ctx.shadowBlur = 10;
                        ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                        // eyes
                        ctx.fillStyle = '#1e2f1e';
                        ctx.shadowBlur = 0;
                        // tiny eye dots (direction dependent, but simple)
                        ctx.beginPath();
                        ctx.arc(x + 6, y + 6, 2.5, 0, Math.PI * 2);
                        ctx.arc(x + 14, y + 6, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(x + 5.5, y + 5.5, 1, 0, Math.PI * 2);
                        ctx.arc(x + 13.5, y + 5.5, 1, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // body segment
                        const intensity = 0.7 + (idx / snake.length) * 0.3;
                        ctx.fillStyle = `rgb(70, 130, 70)`;
                        ctx.shadowColor = '#3e6b3e';
                        ctx.shadowBlur = 6;
                        ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                    }
                });

                // draw food (apple-like)
                if (food) {
                    const fx = food.x * CELL_SIZE;
                    const fy = food.y * CELL_SIZE;
                    ctx.shadowColor = '#e74c3c';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(fx + CELL_SIZE / 2, fy + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    // leaf
                    ctx.fillStyle = '#7ed957';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.ellipse(fx + 12, fy + 5, 4, 2.5, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // shine
                    ctx.fillStyle = '#ffb3b3';
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(fx + 9, fy + 9, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // reset shadow
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';

                // game over / win overlay
                if (gameOver || winFlag) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(0, 0, 400, 400);

                    ctx.font = 'bold 26px "Segoe UI", Roboto, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (winFlag) {
                        ctx.fillStyle = '#d4ed4e';
                        ctx.shadowColor = '#8bc34a';
                        ctx.shadowBlur = 18;
                        ctx.fillText('✨ YOU WIN! ✨', 200, 200);
                    } else {
                        ctx.fillStyle = '#f2b3b3';
                        ctx.shadowColor = '#b71c1c';
                        ctx.shadowBlur = 16;
                        ctx.fillText('GAME OVER', 200, 200);
                    }
                    ctx.shadowBlur = 0;
                }
            }

            // check collisions and update snake position
            function gameTick() {
                if (!gameRunning) return;
                if (gameOver || winFlag) return;

                // apply buffered direction (no 180 reversal)
                if (nextDirection === 'UP' && direction !== 'DOWN') direction = 'UP';
                else if (nextDirection === 'DOWN' && direction !== 'UP') direction = 'DOWN';
                else if (nextDirection === 'LEFT' && direction !== 'RIGHT') direction = 'LEFT';
                else if (nextDirection === 'RIGHT' && direction !== 'LEFT') direction = 'RIGHT';

                // compute new head
                const head = snake[0];
                let newHead = { ...head };

                switch (direction) {
                    case 'RIGHT': newHead.x += 1; break;
                    case 'LEFT':  newHead.x -= 1; break;
                    case 'UP':    newHead.y -= 1; break;
                    case 'DOWN':  newHead.y += 1; break;
                }

                // check wall collision
                if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    gameOver = true;
                    gameRunning = false;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    drawBoard();
                    return;
                }

                // check food collision
                const isEating = (newHead.x === food.x && newHead.y === food.y);

                // build new snake array
                let newSnake = [newHead, ...snake];

                if (!isEating) {
                    // remove tail
                    newSnake.pop();
                }

                // check self-collision (new head vs body of newSnake[1..])
                const headCollision = newSnake.slice(1).some(segment => segment.x === newHead.x && segment.y === newHead.y);
                if (headCollision) {
                    gameOver = true;
                    gameRunning = false;
                    if (gameInterval) {
                        clearInterval(gameInterval);
                        gameInterval = null;
                    }
                    drawBoard();
                    return;
                }

                // update snake
                snake = newSnake;

                if (isEating) {
                    score++;
                    scoreSpan.textContent = score;

                    // generate new food
                    const newFood = generateRandomFood();
                    if (newFood) {
                        food = newFood;
                    } else {
                        // board full → win!
                        winFlag = true;
                        gameRunning = false;
                        if (gameInterval) {
                            clearInterval(gameInterval);
                            gameInterval = null;
                        }
                        drawBoard();
                        return;
                    }
                }

                drawBoard();
            }

            function startGameLoop() {
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    gameTick();
                }, TICK_INTERVAL_MS);
            }

            // ---- keyboard control ----
            function handleKeydown(e) {
                const key = e.key;
                // prevent arrow keys from scrolling
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                    e.preventDefault();
                }

                if (!gameRunning || gameOver || winFlag) return;

                switch (key) {
                    case 'ArrowUp':    nextDirection = 'UP'; break;
                    case 'ArrowDown':  nextDirection = 'DOWN'; break;
                    case 'ArrowLeft':  nextDirection = 'LEFT'; break;
                    case 'ArrowRight': nextDirection = 'RIGHT'; break;
                    default: return;
                }
            }

            // ---- restart ----
            function restartGame() {
                resetGame();
            }

            // ---- initialization ----
            window.addEventListener('load', () => {
                resetGame(); // sets snake, food, starts loop
                window.addEventListener('keydown', handleKeydown);
                document.getElementById('restartButton').addEventListener('click', restartGame);
            });

            // clean up interval if page unloads (optional)
            window.addEventListener('beforeunload', () => {
                if (gameInterval) clearInterval(gameInterval);
            });
        })();
    </script>
</body>
</html>
