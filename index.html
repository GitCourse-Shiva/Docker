<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Racer — simple car game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a1f1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .game-container {
            background: #1a2e2e;
            padding: 1.5rem 2rem 2rem;
            border-radius: 3rem 3rem 2rem 2rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 180, 0.1);
            border-bottom: 6px solid #3b5e5e;
        }

        canvas {
            display: block;
            width: 500px;
            height: 600px;
            border-radius: 24px;
            background: #2d4a4a;
            box-shadow: 0 0 0 4px #102121, 0 15px 25px #00000080;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }

        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d4ede8;
            font-weight: 600;
            padding: 0 0.3rem;
        }

        .score {
            background: #0b1b1b;
            padding: 0.5rem 1.4rem;
            border-radius: 3rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -3px 0 #1f3b3b, 0 5px 0 #0b1b1b;
            font-size: 1.5rem;
            color: #b3f0e0;
            text-shadow: 0 2px 0 #003c3c;
        }

        .restart-btn {
            background: #e0b354;
            border: none;
            border-radius: 3rem;
            padding: 0.55rem 1.8rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e2e2e;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 #8f6f2c, 0 8px 12px black;
            cursor: pointer;
            transition: 0.08s linear;
            text-transform: uppercase;
            border: 1px solid #ffe9b0;
        }

        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #8f6f2c, 0 5px 10px black;
        }

        .hint {
            text-align: center;
            margin-top: 0.5rem;
            color: #8cb3ad;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="ui-panel">
            <span class="score">SCORE: <span id="scoreDisplay">0</span></span>
            <button class="restart-btn" id="restartButton">↻ RESTART</button>
        </div>
        <div class="hint">← → move &nbsp;|&nbsp; avoid red cars</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');

            // ---------- FIXED DIMENSIONS ----------
            const LANE_COUNT = 3;
            const LANE_WIDTH = 110;          // 3 lanes * 110 = 330px road width
            const ROAD_OFFSET = (canvas.width - LANE_WIDTH * LANE_COUNT) / 2; // 85px from left

            // Player
            const PLAYER_WIDTH = 70;
            const PLAYER_HEIGHT = 110;
            const PLAYER_FIXED_Y = canvas.height - 140; // top of the player car

            // Enemy
            const ENEMY_WIDTH = 70;
            const ENEMY_HEIGHT = 110;

            // Game state
            let playerLane = 1;               // 0 left, 1 middle, 2 right
            let score = 0;
            let gameActive = false;
            let animationFrame = null;

            // Objects
            let enemies = [];
            let frameCounter = 0;
            const BASE_SPAWN_RATE = 45;        // frames between spawns (lower = more)
            const MIN_SPAWN_RATE = 20;         // max difficulty

            // Road scroll (for visual effect)
            let roadOffset = 0;
            const ROAD_STRIPE_HEIGHT = 38;
            const ROAD_STRIPE_GAP = 30;

            // ---------- HELPER: get lane center X for a given lane ----------
            function getLaneCenterX(laneIndex) {
                return ROAD_OFFSET + laneIndex * LANE_WIDTH + LANE_WIDTH / 2;
            }

            // ---------- RESET GAME ----------
            function resetGame() {
                // Stop game loop if active
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                playerLane = 1;
                score = 0;
                enemies = [];
                frameCounter = 0;
                gameActive = true;
                roadOffset = 0;

                updateScoreDisplay();
                draw(); // initial draw

                // start the loop
                function gameLoop() {
                    if (!gameActive) return;

                    update();
                    draw();

                    animationFrame = requestAnimationFrame(gameLoop);
                }

                animationFrame = requestAnimationFrame(gameLoop);
            }

            // ---------- UPDATE SCORE DISPLAY ----------
            function updateScoreDisplay() {
                scoreSpan.textContent = Math.floor(score);
            }

            // ---------- SPAWN ENEMY ----------
            function spawnEnemy() {
                // Random lane (0, 1, 2)
                const lane = Math.floor(Math.random() * LANE_COUNT);
                // Ensure it doesn't overlap with the player *at spawn moment*? 
                // It's okay if it spawns in player lane far above, but we prevent instant collision 
                // by placing it at y = -ENEMY_HEIGHT - 10 (fully offscreen)
                const x = getLaneCenterX(lane) - ENEMY_WIDTH / 2;
                const y = -ENEMY_HEIGHT - 10;

                // Additional check: if player is in same lane and very close? 
                // Since enemy is offscreen, no immediate threat. But if player lane same and 
                // enemy spawns just above, it's fine because collision would require overlap.
                // But to avoid unfair spawn right on top of player when they are near top?
                // Player is fixed at bottom, so never collides with offscreen enemy.
                enemies.push({
                    x: x,
                    y: y,
                    lane: lane,
                    width: ENEMY_WIDTH,
                    height: ENEMY_HEIGHT,
                });
            }

            // ---------- UPDATE GAME STATE ----------
            function update() {
                if (!gameActive) return;

                // 1. move enemies downward
                const ENEMY_SPEED = 3.8;
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.y += ENEMY_SPEED;

                    // Remove if off screen (below canvas)
                    if (e.y > canvas.height + 50) {
                        enemies.splice(i, 1);
                        // increase score when enemy passes safely
                        score += 10;
                        updateScoreDisplay();
                    }
                }

                // 2. road stripe animation (visual)
                roadOffset = (roadOffset + ENEMY_SPEED) % (ROAD_STRIPE_HEIGHT + ROAD_STRIPE_GAP);

                // 3. spawn enemies with dynamic rate
                // Difficulty increases with score: spawn faster over time
                const currentSpawnRate = Math.max(MIN_SPAWN_RATE, BASE_SPAWN_RATE - Math.floor(score / 90));
                if (frameCounter % currentSpawnRate === 0) {
                    spawnEnemy();
                }
                frameCounter++;

                // 4. collision detection (player vs enemies)
                const playerRect = {
                    x: getLaneCenterX(playerLane) - PLAYER_WIDTH / 2,
                    y: PLAYER_FIXED_Y,
                    w: PLAYER_WIDTH,
                    h: PLAYER_HEIGHT,
                };

                for (let e of enemies) {
                    const enemyRect = {
                        x: e.x,
                        y: e.y,
                        w: ENEMY_WIDTH,
                        h: ENEMY_HEIGHT,
                    };

                    // AABB collision
                    if (playerRect.x < enemyRect.x + enemyRect.w &&
                        playerRect.x + playerRect.w > enemyRect.x &&
                        playerRect.y < enemyRect.y + enemyRect.h &&
                        playerRect.y + playerRect.h > enemyRect.y) {
                        // Game over
                        gameActive = false;
                        draw(); // show final state
                        return;   // stop update immediately
                    }
                }
            }

            // ---------- DRAWING ----------
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // ---- asphalt ----
                ctx.fillStyle = '#1d2f2f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // ---- road (darker asphalt) ----
                ctx.fillStyle = '#2b4040';
                ctx.fillRect(ROAD_OFFSET, 0, LANE_WIDTH * LANE_COUNT, canvas.height);

                // ---- lane markings (dashed lines) ----
                ctx.strokeStyle = '#e8f0e0';
                ctx.lineWidth = 6;
                ctx.setLineDash([25, 25]);

                // left lane divider (between lane 0 and 1)
                const leftDividerX = ROAD_OFFSET + LANE_WIDTH;
                ctx.beginPath();
                ctx.moveTo(leftDividerX, 0);
                ctx.lineTo(leftDividerX, canvas.height);
                ctx.stroke();

                // right lane divider (between lane 1 and 2)
                const rightDividerX = ROAD_OFFSET + 2 * LANE_WIDTH;
                ctx.beginPath();
                ctx.moveTo(rightDividerX, 0);
                ctx.lineTo(rightDividerX, canvas.height);
                ctx.stroke();

                // ---- moving road stripes (horizontal stripes for speed) ----
                ctx.setLineDash([]);
                ctx.fillStyle = '#9bb8b0';
                for (let y = -ROAD_STRIPE_HEIGHT + roadOffset; y < canvas.height; y += ROAD_STRIPE_HEIGHT + ROAD_STRIPE_GAP) {
                    // draw small rectangles across the road for motion effect
                    ctx.fillRect(ROAD_OFFSET + 8, y, LANE_WIDTH * LANE_COUNT - 16, 6);
                }

                // ---- edge lines (white solid) ----
                ctx.strokeStyle = '#f0f7f0';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(ROAD_OFFSET, 0);
                ctx.lineTo(ROAD_OFFSET, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ROAD_OFFSET + LANE_WIDTH * LANE_COUNT, 0);
                ctx.lineTo(ROAD_OFFSET + LANE_WIDTH * LANE_COUNT, canvas.height);
                ctx.stroke();

                // ---- draw enemies (red cars) ----
                for (let e of enemies) {
                    drawCar(e.x, e.y, '#c0392b', '#a93226', true);
                }

                // ---- draw player (blue car) ----
                const playerX = getLaneCenterX(playerLane) - PLAYER_WIDTH / 2;
                drawCar(playerX, PLAYER_FIXED_Y, '#2980b9', '#1f618d', false);

                // ---- game over overlay if not active ----
                if (!gameActive && enemies.length > 0) {
                    // show game over only if game was active and stopped (avoid showing on fresh canvas)
                    // but we also want to show it after crash
                }
                if (!gameActive) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = 'bold 54px "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#f1c40f';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 18;
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                    ctx.font = 'bold 30px "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#ecf0f1';
                    ctx.fillText('PRESS RESTART', canvas.width / 2, canvas.height / 2 + 60);
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                } else {
                    // small "GO" hint when game running (optional)
                }

                // reset shadow and text align
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }

            // ---------- DRAW CAR (shared for player and enemies) ----------
            function drawCar(x, y, mainColor, darkColor, isEnemy) {
                const w = (isEnemy) ? ENEMY_WIDTH : PLAYER_WIDTH;
                const h = (isEnemy) ? ENEMY_HEIGHT : PLAYER_HEIGHT;

                // body
                ctx.shadowColor = '#00000070';
                ctx.shadowBlur = 12;
                ctx.fillStyle = mainColor;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 12);
                ctx.fill();

                // dark roof / cabin
                ctx.fillStyle = darkColor;
                ctx.beginPath();
                ctx.roundRect(x + 10, y + 20, w - 20, 40, 8);
                ctx.fill();

                // windows
                ctx.fillStyle = '#a4d1f0';
                ctx.shadowBlur = 6;
                // windshield (front)
                ctx.beginPath();
                ctx.roundRect(x + 10, y + 15, w - 20, 18, 6);
                ctx.fill();
                // rear window
                ctx.beginPath();
                ctx.roundRect(x + 10, y + h - 45, w - 20, 18, 6);
                ctx.fill();

                // headlights / taillights
                ctx.fillStyle = '#f7dc6f';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(x + 10, y + 8, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + w - 10, y + 8, 7, 0, Math.PI * 2);
                ctx.fill();

                if (isEnemy) {
                    // red taillights
                    ctx.fillStyle = '#e6b800';
                    ctx.beginPath();
                    ctx.arc(x + 10, y + h - 10, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + w - 10, y + h - 10, 7, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // white headlights for player (bottom)
                    ctx.fillStyle = '#f0f3f4';
                    ctx.beginPath();
                    ctx.arc(x + 10, y + h - 10, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + w - 10, y + h - 10, 7, 0, Math.PI * 2);
                    ctx.fill();
                }

                // wheel arches (dark)
                ctx.fillStyle = '#1a1a1a';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.ellipse(x + 10, y + h - 10, 10, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + w - 10, y + h - 10, 10, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // reset shadow
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            // helper: CanvasRenderingContext2D.roundRect
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };

            // ---------- KEYBOARD CONTROLS ----------
            function handleKeyDown(e) {
                if (!gameActive) return;   // no moving after game over

                const key = e.key;
                // prevent arrow keys from scrolling
                if (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown') {
                    e.preventDefault();
                }

                if (key === 'ArrowLeft' && playerLane > 0) {
                    playerLane--;
                } else if (key === 'ArrowRight' && playerLane < LANE_COUNT - 1) {
                    playerLane++;
                }
            }

            // ---------- INITIAL SETUP AND EVENT LISTENERS ----------
            window.addEventListener('keydown', handleKeyDown);

            // restart button
            document.getElementById('restartButton').addEventListener('click', () => {
                resetGame();
            });

            // also restart by clicking on canvas (convenient)
            canvas.addEventListener('click', () => {
                if (!gameActive) {
                    resetGame();
                }
            });

            // initial start (resetGame will set gameActive and start loop)
            resetGame();

            // Prevent page scroll from arrow keys (already done in keydown, but extra)
            window.addEventListener('keyup', (e) => {
                if (e.key.startsWith('Arrow')) e.preventDefault();
            });

            // optional: when tab loses focus, keep game running (no pause)
        })();
    </script>
</body>
</html>
